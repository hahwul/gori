# https://github.com/crystal-actions/contributor-mural
#
# One wall, no sections. The role line under each name carries what the person
# did, which is the only way a single wall can say that someone both wrote code
# and filed the report that found the bug — a titled "Special Thanks" section
# would have to pick one of the two, and people move between them.
#
# `contributors:` fills the wall from the API and gives everyone it yields the
# role `Code`, so a new contributor arrives already labelled and this file only
# names the exceptions: someone whose role is not just code, and someone who
# helped without a commit and so is not in the API at all.
#
# Everyone is labelled by their GitHub login, and no entry sets `name`. The
# contributors API does not report display names, so a `name` here would only
# ever cover the people someone remembered to write down — the next contributor
# would arrive as a login beside them. The login is also what the avatar links
# to, so it is the one label the whole wall can carry without upkeep.
#
# Roles name a kind of contribution, not an amount of it — one word or two, the
# same weight for everyone. Spelling out what a report contained while a commit
# stays "Code" ranks the wall by how much was written here, which is backwards.
#
# `weight: 0` marks the entries with no commits. The wall ranks by weight, and
# the contributors API counts from one commit up — so an entry left at the
# default weighed exactly as much as whoever has a single commit, and the two
# were separated by nothing but the alphabet. That is how someone who wrote
# code ended up standing in the middle of the people thanked for reports. 0 is
# the rung the API can never report, so it holds the thanks behind everyone
# with a commit without titling either half of the wall. Every new entry here
# that arrives without a commit wants it.
style: grid

output: docs/static/CONTRIBUTORS.svg

contributors:
  role: Code

users:
  - login: hahwul
    role: Creator, Maintainer
  - login: d0kk2bi
    role: Code, Bug Reports
  - login: bash-bunny
    role: Bug Reports
    weight: 0
  - login: pwnxpl0it
    role: Bug Reports
    weight: 0

exclude:
  - dependabot[bot]
  - github-actions[bot]
  - Copilot
  - imgbot[bot]

grid:
  # The headcount picks the width: one row until `max_columns`, then the fewest
  # even rows that hold everyone. A number here is a count of today's people,
  # and it goes stale the moment someone lands their first commit — this wall
  # was 3 columns, then 8, and would need editing again at nine faces.
  columns: auto
  max_columns: 10
  avatar_size: 96
  shape: circle
  margin: 16
  show_names: true
  # Full names and roles, uncut: this wall is short enough to afford them.
  truncate: 0
