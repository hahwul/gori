---
name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - shard.yml
      - shard.lock
      - "**/*.cr"
      # `docker/Dockerfile` is deliberately absent: nothing in this workflow
      # builds the image any more (see the note under `tests`), so listing it
      # would only wake the Crystal build and the spec matrix to test nothing
      # that changed.
  # Builds the PROSPECTIVE MERGE RESULT, not the PR branch. Without this, two PRs that
  # each pass CI alone and touch different hunks of one file can merge cleanly and leave
  # `main` broken — which is exactly what #371 + #372 did (#382): one changed a method's
  # arity, the other added a call site against the old signature. Inert until a merge
  # queue is enabled for `main` in the repository settings; harmless before then.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      logLevel:
        description: manual run
        required: false
        default: ""
jobs:
  build-crystal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor shard.yml declares (`>= 1.20.2`) and the version development
        # actually happens on. 1.21 is not incidental: the termisu fork and the
        # ameba master pin in shard.yml exist specifically because upstream does
        # not compile under it, so leaving 1.21 untested would test a toolchain
        # nobody uses.
        crystal-version: [1.20.2, 1.21.0]
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal-version }}
      - name: Install native link dependencies
        # brotli/zstd are linked via `@[Link(pkg_config:)]` (proxy/codec), sqlite3
        # via the sqlite3 shard. The rest (openssl, yaml, gmp, pcre2, gc, zlib)
        # arrive as dependencies of the Crystal package itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libbrotli-dev libzstd-dev libsqlite3-dev
      - name: Install dependencies
        run: shards install
      - name: Build
        # Deliberately NO `-Dpreview_mt`. Store, Fuzz::Engine, Miner::Engine and
        # Store::SafeRegexp each document that their plain ivars and unguarded
        # counters are safe *because* gori runs on the single-threaded fiber
        # scheduler. Enabling MT here would build a binary those files do not
        # describe.
        run: shards build
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          # Deliberately NOT the build matrix. `crystal tool format` is the formatter
          # shipped WITH the compiler, so its output is a property of the version that
          # runs it, not of this repo — gating on two versions would ask the tree to be
          # a fixed point of two different formatters at once. Pin the one development
          # happens on; bump this line when that moves.
          crystal: 1.21.0
      # No `shards install`, and the paths are explicit rather than a bare `--check`:
      # the bare form walks the whole working directory, which after an install means
      # gating on `lib/` — third-party code this repo cannot fix, breaking the build on
      # a dependency bump for a formatting change nobody here made.
      - name: Check formatting
        run: crystal tool format --check src spec bench scripts
  benchmarks:
    # Type-checks every harness in `bench/`. Nothing ran them before: `format` above only
    # FORMATS bench/, and the other jobs build `src` and run `spec` — so a harness could rot
    # for months and the first sign would be someone reaching for it mid-investigation.
    # Seventeen of them had. AGENTS.md points at these for "measure, don't guess", and a
    # measurement tool that does not compile is worse than none: it turns a decision that
    # should be made on numbers into one made on a plausible story.
    #
    # `--no-codegen`, so this checks that they still describe the API they measure without
    # paying for optimised binaries — 26s for the whole directory on a cold cache. They are
    # NOT executed: several want a loopback origin or a seeded multi-GB database, and their
    # run times are measured in minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          # One version, not the build matrix, for the same reason `format` pins one: the
          # harnesses compile against the same `src` the matrix already builds twice, so a
          # second version here would re-test the compiler rather than this repo.
          crystal: 1.21.0
      - name: Install native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libbrotli-dev libzstd-dev libsqlite3-dev
      - name: Install dependencies
        run: shards install
      - name: Type-check bench harnesses
        # The same script `just benchmark-check` runs, so local and CI cannot drift apart
        # (and this job needs no `just` on the runner).
        run: scripts/bench_check.sh
  # Still no ameba job. The backlog is down from 965 findings to 641, but 248 of the
  # remainder are Metrics/CyclomaticComplexity in the TUI — splitting those methods is a
  # real refactor, not lint cleanup, and `.ameba.yml` already records the decision to
  # raise the bar to 12 rather than carve them up. `just check` still runs it locally.
  # Add the gate when that category is dealt with, not by excluding it — a check that is
  # always red is a check nobody reads, but one that is green by exclusion is worse.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crystal-version: [1.20.2, 1.21.0]
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal-version }}
      - name: Install native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libbrotli-dev libzstd-dev libsqlite3-dev
      - name: Install dependencies
        run: shards install
      - name: Run tests
        # `-Wl,--no-export-dynamic` is a WORKAROUND for a linker bug, not a preference.
        #
        # Crystal links every binary with `-rdynamic`, which puts the whole program into
        # `.dynsym`. Past some size the produced spec binary's symbol table and its version
        # table stop agreeing, and the loader refuses it with a nonsense pairing:
        #
        #   undefined symbol: sqlite3_open_v2, version GLIBC_2.3
        #   undefined symbol: sqlite3_open_v2, version GLIBC_2.25   # same build, next run
        #   undefined symbol: environ, version Socket#read_timeout=<Time::Span>:Time::Span
        #
        # — a sqlite symbol tagged with a glibc version, a glibc symbol tagged with a Crystal
        # METHOD NAME, and the tag changing between builds of the same tree. Nothing is
        # actually missing: `ldd` is clean, the libraries are installed, and the same tree
        # runs green on macOS and links fine into `bin/gori` (the `build-crystal` job above
        # passes). It is the version index being read from a table that no longer lines up.
        #
        # Measured on the PR that first tripped it: `crystal spec` failed at load, `--no-debug`
        # failed the same way (so it is not debug info), and this flag ran the suite green.
        # The tree was 143 symbols and 0.19% larger than the `main` that passed — i.e. `main`
        # sits just under the cliff and the next change of any size would have gone over.
        # Scoped to this job because it is the only binary that crosses it.
        #
        # Nothing is lost: with debug info on (the default here) Crystal symbolizes backtraces
        # from DWARF, not from the dynamic symbol table, so spec failures still name their
        # frames. gori dlopen()s nothing and no linked C library calls back into a Crystal
        # symbol by name, so there is no consumer of the export either.
        #
        # DELETE THIS once the toolchain stops mis-emitting the table.
        run: crystal spec --link-flags "-Wl,--no-export-dynamic"
# No `build-docker` job here. It used to build docker/Dockerfile for amd64 and
# arm64 on every PR, and those two builds — each compiling a static Crystal
# binary from source, the arm64 one on a native runner because QEMU is far too
# slow for it — dominated PR wall-clock while catching almost nothing: the
# Dockerfile changes far less often than the code it packages.
#
# It is not gated to `main` pushes either, because on a `main` push it would be
# pure duplicate work: `publish-ghcr.yml` already builds the same Dockerfile,
# for the same two platforms, on the same runners, on every push to `main` — it
# just pushes the result instead of throwing it away. A Dockerfile break is
# caught there, one merge late, before anything is released. If you ever want
# the image validated *before* a merge again, add `pull_request` to
# publish-ghcr.yml's build job with `push: false` rather than reviving a second
# copy of the build here.
