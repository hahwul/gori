---
name: Chocolatey Publish
# Publishes the versioned Windows binary through Chocolatey after the release
# assets and SHA256SUMS have been uploaded. Dispatch supports backfills and a
# full pack/install dry run without pushing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.8.0)"
        required: true
        type: string
      dry_run:
        description: "Pack and smoke-test without pushing to Chocolatey"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Build and Release Binaries"]
    types: [completed]
permissions:
  contents: read
jobs:
  publish-package:
    name: Publish package to Chocolatey
    # Match the Homebrew/AUR publishers: only a successful release build has
    # the versioned assets this package needs; workflow_dispatch can backfill.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: windows-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:DISPATCH_VERSION -replace '^v', ''
          } else {
            $version = $env:RUN_TAG -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Version is empty.'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version"

      - name: Checkout package templates
        uses: actions/checkout@v6

      - name: Download SHA256SUMS and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTag = "v$env:VERSION"
          $assetName = "gori-v$env:VERSION-windows-x86_64.exe"
          $releaseJson = gh release view $releaseTag --repo hahwul/gori --json assets
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect release $releaseTag."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.assets.name -notcontains $assetName) {
            throw "Release $releaseTag is missing required Windows asset $assetName. Chocolatey publishing starts with releases after v0.7.1."
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          gh release download $releaseTag --repo hahwul/gori --pattern SHA256SUMS --dir out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path out/SHA256SUMS)) {
            throw "Release $releaseTag is missing SHA256SUMS."
          }

          $sha256 = $null
          foreach ($line in Get-Content out/SHA256SUMS) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$' -and $Matches[2] -eq $assetName) {
              $sha256 = $Matches[1].ToLowerInvariant()
              break
            }
          }
          if (-not $sha256) {
            throw "SHA256SUMS for $releaseTag has no checksum for $assetName."
          }
          "SHA256=$sha256" >> $env:GITHUB_ENV
          Write-Host "Found SHA256 for $assetName."

      - name: Render package files
        shell: pwsh
        run: |
          $nuspec = (Get-Content packaging/chocolatey/gori.nuspec.tmpl -Raw).Replace('__VERSION__', $env:VERSION)
          $install = (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1.tmpl -Raw).Replace('__VERSION__', $env:VERSION).Replace('__SHA256__', $env:SHA256)
          [IO.File]::WriteAllText((Join-Path $PWD 'out/gori.nuspec'), $nuspec, [Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force -Path out/tools | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'out/tools/chocolateyinstall.ps1'), $install, [Text.UTF8Encoding]::new($false))
          Write-Host '----- rendered nuspec -----'
          Get-Content out/gori.nuspec
          Write-Host '----- rendered install script -----'
          Get-Content out/tools/chocolateyinstall.ps1

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          Push-Location out
          try {
            choco pack gori.nuspec --outputdirectory ..
            if ($LASTEXITCODE -ne 0) { throw 'choco pack failed.' }
          } finally {
            Pop-Location
          }

      - name: Smoke-test local package
        shell: pwsh
        run: |
          choco install gori --source . -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Local Chocolatey install failed.' }
          $versionOutput = & gori --version 2>&1
          $goriExit = $LASTEXITCODE
          $versionText = $versionOutput -join "`n"
          Write-Host $versionText
          if ($goriExit -ne 0 -or $versionText -notmatch [regex]::Escape($env:VERSION)) {
            throw "gori --version did not print expected version $env:VERSION."
          }

      - name: Push package
        if: ${{ github.event_name == 'workflow_run' || inputs.dry_run != true }}
        env:
          CHOCOLATEY_KEY: ${{ secrets.CHOCOLATEY_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_KEY)) {
            throw 'CHOCOLATEY_KEY is not configured.'
          }
          choco push "gori.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_KEY"
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package push failed.' }

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: pwsh
        run: Write-Host "Dry run passed for gori $env:VERSION; package was not pushed."
