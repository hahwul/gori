---
name: Windows
# Native Windows build, smoke test and spec suite (#1510). Its own workflow rather than a ci.yml job
# because it also runs on stacked PRs, whose base is not main.
on:
  pull_request:
    # No `branches:` filter: Windows work lands as stacked PRs.
    paths:
      - .github/workflows/windows.yml
      - scripts/build-windows.sh
      - scripts/windows_specs.sh
      - shard.yml
      - shard.lock
      - "**/*.cr"
      # Embedded by src/gori/mcp/prompts.cr (#1596): an edit changes the binary.
      - docs/content/playbooks/*.md
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - scripts/build-windows.sh
      - scripts/windows_specs.sh
      - shard.yml
      - shard.lock
      - "**/*.cr"
      # Embedded by src/gori/mcp/prompts.cr (#1596): an edit changes the binary.
      - docs/content/playbooks/*.md
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    # Which specs the Windows runner compiles and runs, by ci.yml's selector: a pull request
    # gets the specs mirroring its change, and the full suite only when the selector says so or
    # this workflow's own machinery changed. Pushes and manual runs always run the full suite.
    # The full suite is ~30 minutes on one runner, so it is split across four (`specs` below).
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mode=full
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
            mode=$(scripts/ci_test_scope.sh "$base")
            if git diff --name-only "$(git merge-base "$base" HEAD)" HEAD |
              grep -qxE '\.github/workflows/windows\.yml|scripts/(build-windows|windows_specs)\.sh'; then
              mode=full
            fi
          fi
          files=""
          if [ "$mode" = "changed" ]; then
            files=$(scripts/spec_for_changes.sh "$base" | xargs -I{} find {} -name '*_spec.cr' | sort -u | tr '\n' ' ')
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Windows spec scope: $mode $files"

  build:
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      specs: ${{ steps.specs.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Cache vcpkg libraries
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ hashFiles('scripts/build-windows.sh') }}
      - name: Build
        id: build
        # Static, as the released .exe is built (release-binary.yml calls the same script).
        run: scripts/build-windows.sh src/main.cr bin/gori.exe
      - name: Smoke test
        # Proxy one http and one MITM'd https request, then read them back from the store:
        # sockets, TLS, the CA, SQLite and the writer fiber, end to end.
        run: |
          export GORI_HOME="$RUNNER_TEMP/gori-home"
          ./bin/gori.exe --version
          ./bin/gori.exe run capture --port 18070 --max 2 --for 90s > "$RUNNER_TEMP/capture.log" 2>&1 &
          pid=$!
          trap 'echo "--- capture.log"; cat "$RUNNER_TEMP/capture.log"' EXIT
          # The first request doubles as the wait for the listener.
          for _ in $(seq 1 30); do
            curl -fsS -m 20 -o /dev/null -x http://127.0.0.1:18070 http://example.com/ && break
            sleep 1
          done
          curl -fsS -m 20 -o /dev/null -k -x http://127.0.0.1:18070 https://example.com/
          wait "$pid"
          ./bin/gori.exe run history | tee "$RUNNER_TEMP/history.txt"
          test "$(grep -c example.com "$RUNNER_TEMP/history.txt")" -eq 2
      - name: TUI smoke (ConPTY)
        # The TUI under a real Windows pseudo-console: termisu's console backend (modes, size,
        # VT input) and the renderer, driven the way an operator would — skip the wizard, watch
        # a proxied request land in History, quit with ^C ^C.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: python
        run: |
          import os, re, subprocess, sys, threading, time
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pywinpty", "pyte"], check=True)
          import pyte
          from winpty import PtyProcess

          home = os.path.join(os.environ["RUNNER_TEMP"], "tui-home")
          os.makedirs(home, exist_ok=True)
          env = dict(os.environ, GORI_HOME=home)
          p = PtyProcess.spawn([r"bin\gori.exe", "--db", os.path.join(home, "t.db"), "--port", "18094"],
                               dimensions=(40, 120), env=env)
          # The renderer redraws only the cells that changed, so the raw stream is not text to
          # search: replay it into a VT screen and read the screen.
          screen = pyte.Screen(120, 40)
          stream = pyte.Stream(screen)
          lock = threading.Lock()

          def pump():
              while True:
                  try:
                      chunk = p.read(4096)
                  except EOFError:
                      return
                  with lock:
                      stream.feed(chunk)

          threading.Thread(target=pump, daemon=True).start()

          def shown():
              with lock:
                  return "\n".join(screen.display)

          def wait_for(text, timeout=60):
              end = time.time() + timeout
              while time.time() < end:
                  if text in shown():
                      print(f"saw {text!r}")
                      return
                  time.sleep(0.2)
              print(shown())
              sys.exit(f"the TUI never showed {text!r}")

          wait_for("setup wizard")
          p.write("\x1b")
          time.sleep(1)
          p.write("\x1b")
          wait_for("waiting for traffic")
          subprocess.run(["curl", "-fsS", "-m", "20", "-o", os.devnull,
                          "-x", "http://127.0.0.1:18094", "http://example.com/"], check=True)
          wait_for("example.com")
          p.write("\x03")
          time.sleep(1)
          p.write("\x03")
          end = time.time() + 20
          while p.isalive() and time.time() < end:
              time.sleep(0.2)
          if p.isalive():
              p.terminate(force=True)
              sys.exit("the TUI did not quit on ^C ^C")
          print(f"exit status {p.exitstatus}")
          sys.exit(0 if p.exitstatus == 0 else 1)
      - name: Build specs
        id: specs
        # Runs even when the smoke test failed: the two find different things.
        # Built, not `crystal spec`: that hands --static to the runner instead of the linker.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.mode != 'none' }}
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          FILES: ${{ needs.scope.outputs.files }}
        run: |
          if [ "$MODE" = "full" ]; then
            echo 'require "./spec/**"' > all_specs.cr
          else
            for f in $FILES; do echo "require \"./$f\""; done > all_specs.cr
          fi
          start=$SECONDS
          scripts/build-windows.sh all_specs.cr bin/specs.exe --no-debug
          echo "spec runner built in $((SECONDS - start))s"
      - name: Specs
        if: ${{ !cancelled() && steps.specs.outcome == 'success' && needs.scope.outputs.mode == 'changed' }}
        env:
          # A hang is a failure to see, not five minutes to wait out.
          GORI_SPEC_EXAMPLE_TIMEOUT: "60"
          FILES: ${{ needs.scope.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # one argument per spec file
          scripts/windows_specs.sh bin/specs.exe $FILES
      - name: Hand the spec runner to the shards
        if: ${{ !cancelled() && steps.specs.outcome == 'success' && needs.scope.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-specs
          path: bin/specs.exe
          retention-days: 1

  specs:
    # The full suite, split four ways by scripts/spec_shard.sh (ci.yml's partition) over the one
    # static runner `build` compiled: each shard pays for a checkout, `shards install` and a
    # download, not a build.
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.outputs.mode == 'full' && needs.build.outputs.specs == 'success' }}
    name: specs (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install shards
        # Some specs read a shard's source (termisu's input loop), so `lib/` must exist.
        run: shards install --production
      - uses: actions/download-artifact@v4
        with:
          name: windows-specs
          path: bin
      - name: Specs
        env:
          GORI_SPEC_EXAMPLE_TIMEOUT: "60"
        run: |
          # shellcheck disable=SC2046 # one argument per spec file
          scripts/windows_specs.sh bin/specs.exe $(scripts/spec_shard.sh ${{ matrix.shard }} 4)
