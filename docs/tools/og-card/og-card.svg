<?xml version="1.0" encoding="UTF-8"?>
<!-- gori brand card (1200x630). Rendered once locally by generate.sh
     (rsvg-convert) and committed as static/images/og-card.png. The art is
     gori-wallpaper.webp cropped to the card, which already carries the gold
     mark and the wordmark; this layer only adds the tagline in the ink sky
     above them. Helvetica Neue so macOS font metrics cannot break it. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a11" stop-opacity="0.7"/>
      <stop offset="0.22" stop-color="#080a11" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image xlink:href="og-card-art.png" x="0" y="0" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#topShade)"/>

  <text x="600" y="76" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="9"
        fill="#e6cf92" fill-opacity="0.9">SIT IN THE LOOP</text>
</svg>
