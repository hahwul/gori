name: gori
version: 0.2.0

authors:
  - hahwul <hahwul@gmail.com>

targets:
  gori:
    main: src/main.cr

crystal: '>= 1.20.2'

license: Apache-2.0

# System libraries linked by default (via pkg-config) for HTTP body decode in the
# detail view: libbrotlidec (Content-Encoding: br) and libzstd (zstd). Install on
# macOS: `brew install brotli zstd`; Debian/Ubuntu: `apt install libbrotli-dev
# libzstd-dev`. To build WITHOUT them (gzip/deflate still work via stdlib), pass
# `-Dwithout_native_codecs` to `crystal build`.

dependencies:
  termisu:
    github: hahwul/termisu
    branch: main
    # Temporarily on the fork again. Synced to upstream v0.6.1; the fork carries
    # three patches on top, all three open upstream. Go back to `omarluq/termisu`
    # once they land in a release.
    #
    # 1. input/parser: `Event::Key#char` reports WHICH byte produced an Enter
    #    ('\r' for 0x0D, '\n' for 0x0A). Without it a pasted CRLF is two
    #    indistinguishable Enters and `Tui::PasteNewline` cannot collapse the pair.
    #    omarluq/termisu#166.
    # 2. terminal: `with_mode` turns mouse reporting OFF before it yields the tty,
    #    so an $EDITOR shell-out does not take SGR reports (`\e[<0;40;12M`) into
    #    its own stdin. This is what `Runner.suspend_without_mouse` works around
    #    caller-side; that helper goes away when we are back on upstream with this
    #    merged. omarluq/termisu#167.
    # 3. input/terminal: bracketed paste (DEC private mode 2004), surfaced as
    #    `Key::PasteStart` / `Key::PasteEnd`. `char` alone is not enough — some
    #    terminals map the LF of a pasted CRLF to a SECOND CR, and CR CR is by
    #    definition what pressing Enter twice looks like, so only boundary markers
    #    close it. `Tui::PasteNewline` keeps handling the pair for terminals that
    #    ignore 2004. omarluq/termisu#168.
    #
    # Earlier fork carries, upstream now and included via the synced main:
    # input/preedit (double-English + jamo-separation: protocol_active dup-guard +
    # Preedit for key=0 text events) as of v0.5.0; the Crystal 1.21
    # `crystal/thread_local_value` removal (thread-keyed Hash in
    # Termisu::FFI::ErrorState) as of v0.6.0; the Ctrl/Alt CSI-u dup-guard fix (^P
    # then "pet" produced "et") and the termios by-value bug (raw mode never
    # cleared ICRNL/IXON/OPOST, so CR arrived as NL and ^S froze the TUI), both as
    # of v0.6.1.

  db:
    github: crystal-lang/crystal-db
    version: ~> 0.14
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.23

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    branch: master
    # master (1.7.0-dev) rather than the 1.6.4 release: 1.6.4's postinstall does not
    # compile under Crystal 1.21 (`next_string_array_token` undefined for
    # Crystal::Lexer), and that failure aborts `shards build` for the whole project.
    # Move back to a version constraint once 1.7.0 is released.
